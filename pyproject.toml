[project]
name = "attention"
version = "0.1.0"
description = "Transformer pédagogique français standard et Gen Z"
readme = "README.md"
authors = [
    { name = "Julien MacBook Pro", email = "julien.f2004@icloud.com" }
]
requires-python = ">=3.14"
dependencies = [
    "tokenizers>=0.22.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "numpy>=2.0.0",
    "torch>=2.14.1",
]

[project.scripts]
attention = "attention:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.28"]

[tool.pytest.ini_options]
pythonpath = ["src"]
